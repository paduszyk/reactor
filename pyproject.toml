[project]
name = "reactor"
version = "1.dev0"
requires-python = ">=3.15"
dependencies = [
  "django>=6.1.2",
  "django-environ>=0.14.0",
  "gunicorn>=26.2.0",
  "whitenoise>=6.12.0",
]

[project.optional-dependencies]
databases-mysql = [
  "mysqlclient>=2.3.0",
]
databases-postgresql = [
  "psycopg[binary]>=3.3.6",
]
storages-azure = [
  "django-storages[azure]>=1.14.6",
]
storages-google = [
  "django-storages[google]>=1.14.6",
]
storages-s3 = [
  "django-storages[s3]>=1.14.6",
]
storages-sftp = [
  "django-storages[sftp]>=1.14.6",
]

[dependency-groups]
dev = [
  { include-group = "pytest" },
  { include-group = "ruff" },
]
pytest = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-django>=4.14.0",
  "pytest-env>=1.8.1",
  "pytest-mock>=3.17.0",
  "pytest-randomly>=5.0.0",
]
ruff = [
  "ruff>=0.17.2",
]
