[project]
name = "reactor"
version = "1.dev0"
requires-python = ">=3.15"
dependencies = [
  "django>=6.1.2",
  "django-environ>=0.14.0",
]

[dependency-groups]
dev = [
  { include-group = "local" },
  { include-group = "pytest" },
  { include-group = "ruff" },
]
local = [
  "django-browser-reload>=1.21.0",
  "django-debug-toolbar>=8.0.0",
  "django-watchfiles>=1.4.0",
]
pytest = [
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "pytest-django>=4.14.0",
  "pytest-env>=1.8.3",
  "pytest-mock>=3.17.0",
  "pytest-randomly>=5.0.0",
]
ruff = [
  "ruff>=0.17.3",
]
