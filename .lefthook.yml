pre-commit:
  jobs:
    - name: EditorConfig checker
      files: |
        if git diff --cached --quiet -- .editorconfig; then
          git diff --cached --name-only --diff-filter=ACMR
        else
          git ls-files
        fi
      run: >-
        npm exec --no -- editorconfig-checker {files}
    - name: Prettier
      files: |
        if git diff --cached --quiet -- .prettierrc.*; then
          git diff --cached --name-only --diff-filter=ACMR
        else
          git ls-files
        fi
      run: >-
        npm exec --no -- prettier --check --ignore-unknown {files}
    - name: Tombi
      files: |
        if git diff --cached --quiet -- .tombi.toml; then
          git diff --cached --name-only --diff-filter=ACMR
        else
          git ls-files
        fi
      glob:
        - "*.toml"
      group:
        piped: true
        jobs:
          - name: Linter
            run: >-
              npm exec --no -- tombi lint {files}
          - name: Formatter
            run: >-
              npm exec --no -- tombi format --check {files}
    - name: uv
      glob:
        - ".python-version"
        - "pyproject.toml"
        - "uv.lock"
      group:
        piped: true
        jobs:
          - name: Lock file
            run: >-
              uv lock --check
    - name: Ruff
      files: |
        if git diff --cached --quiet -- .ruff.toml; then
          git diff --cached --name-only --diff-filter=ACMR
        else
          git ls-files
        fi
      glob:
        - "*.py"
      group:
        piped: true
        jobs:
          - name: Linter
            run: >-
              uv run --no-sync -- ruff check --force-exclude {files}
          - name: Formatter
            run: >-
              uv run --no-sync -- ruff format --check --force-exclude {files}
    - name: Django
      only:
        - ref: main
      env:
        DJANGO_SETTINGS_MODULE: reactor.conf.settings.dev
      group:
        piped: true
        jobs:
          - name: System check
            run: >-
              uv run --no-sync -- python -m django check --fail-level=ERROR
          - name: Migration check
            run: >-
              uv run --no-sync -- python -m django makemigrations --skip-checks --check
          - name: Translations
            group:
              piped: true
              jobs:
                - name: Extraction
                  run: >-
                    uv run --no-sync -- python -m django makemessages --all --no-location --no-obsolete
                - name: Catalog diff
                  run: >-
                    git diff --exit-code -- ":(glob)**/*.po"
                    && test -z "$(git ls-files --others --exclude-standard -- ':(glob)**/*.po')"
                - name: Compilation
                  run: >-
                    uv run --no-sync -- python -m django compilemessages --ignore=".venv"
