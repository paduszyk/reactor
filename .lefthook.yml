templates:
  npm-exec: npm exec --no --

pre-commit:
  jobs:
    - name: EditorConfig checker
      run: >-
        {npm-exec} editorconfig-checker {staged_files}
    - name: Prettier
      run: >-
        {npm-exec} prettier --check --ignore-unknown {staged_files}
    - name: Tombi
      glob:
        - "*.toml"
      group:
        piped: true
        jobs:
          - name: Linter
            run: >-
              {npm-exec} tombi lint {staged_files}
          - name: Formatter
            run: >-
              {npm-exec} tombi format --check {staged_files}
