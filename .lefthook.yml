templates:
  npm-exec: npm exec --no --
  uv-run: uv run --no-sync --

pre-commit:
  only:
    - ref: main
  jobs:
    - name: EditorConfig checker
      files: |
        if git diff --cached --quiet -- .editorconfig; then
          git diff --cached --diff-filter=ACMR --name-only
        else
          git ls-files
        fi
      run: |
        {npm-exec} editorconfig-checker {files}
    - name: Prettier
      files: |
        if git diff --cached --quiet -- .prettierrc.toml; then
          git diff --cached --diff-filter=ACMR --name-only
        else
          git ls-files
        fi
      run: |
        {npm-exec} prettier --check --ignore-unknown {files}
    - name: uv
      glob:
        - ".python-version"
        - "pyproject.toml"
        - "uv.lock"
        - "uv.toml"
      group:
        piped: true
        jobs:
          - name: Lock check
            run: |
              uv lock --check
    - name: Ruff
      glob:
        - "*.py"
      files: |
        if git diff --cached --quiet -- .ruff.toml; then
          git diff --cached --diff-filter=ACMR --name-only
        else
          git ls-files
        fi
      group:
        piped: true
        jobs:
          - name: Linter
            run: |
              {uv-run} ruff check --force-exclude {files}
          - name: Formatter
            run: |
              {uv-run} ruff format --force-exclude --check {files}
    - name: Django
      env:
        DJANGO_SETTINGS_MODULE: reactor.conf.settings.dev
      group:
        piped: true
        jobs:
          - name: System check
            run: |
              {uv-run} python -m django check --fail-level=ERROR
          - name: Migrations
            run: |
              {uv-run} python -m django makemigrations --skip-checks --check
          - name: Translations
            group:
              piped: true
              jobs:
                - name: Extraction
                  run: |
                    {uv-run} python -m django makemessages --all --no-location --no-obsolete
                - name: Catalog check
                  run: >-
                    git diff --exit-code -- ":(glob)**/*.po"
                    && test -z "$(git ls-files --others --exclude-standard -- ':(glob)**/*.po')"
                - name: Compilation
                  run: |
                    {uv-run} python -m django compilemessages --ignore=".venv"
