templates:
  npm-exec: npm exec --no --
  uv-run: uv run --no-sync

pre-commit:
  fail_on_changes: non-ci
  jobs:
    - name: EditorConfig checker
      files: |
        if git diff --cached --quiet -- .editorconfig; then
          git diff --cached --name-only --diff-filter=ACMR
        else
          git ls-files
        fi
      run: |
        {npm-exec} editorconfig-checker -fix {files}
    - name: Prettier
      files: |
        if git diff --cached --quiet -- .prettierrc.toml; then
          git diff --cached --name-only --diff-filter=ACMR
        else
          git ls-files
        fi
      run: |
        {npm-exec} prettier --write --ignore-unknown {files}
    - name: uv
      glob:
        - ".python-version"
        - "pyproject.toml"
        - "uv.lock"
        - "uv.toml"
      group:
        piped: true
        jobs:
          - name: Lock file check
            run: |
              uv lock --check
          - name: Environment sync check
            run: |
              uv sync --check
    - name: Ruff
      glob:
        - "*.py"
      files: |
        if git diff --cached --quiet -- .ruff.toml; then
          git diff --cached --name-only --diff-filter=ACMR
        else
          git ls-files
        fi
      group:
        piped: true
        jobs:
          - name: Lint check
            run: |
              {uv-run} ruff check --fix {files}
          - name: Format check
            run: |
              {uv-run} ruff format {files}
