assert_lefthook_installed: true

pre-commit:
  fail_on_changes: non-ci
  jobs:
    - name: EditorConfig checker
      files: |
        if git diff --cached --quiet -- .editorconfig; then
          git diff --cached --name-only --diff-filter=ACMR
        else
          git ls-files
        fi
      run: npm exec --no -- editorconfig-checker -fix {files}
    - name: Prettier
      files: |
        if git diff --cached --quiet -- .prettierrc.toml; then
          git diff --cached --name-only --diff-filter=ACMR
        else
          git ls-files
        fi
      run: npm exec --no -- prettier --write --ignore-unknown {files}
    - name: uv
      glob:
        - pyproject.toml
        - uv.lock
      group:
        jobs:
          - name: Lock file check
            run: uv lock --check
          - name: Environment sync check
            run: uv sync --check
    - name: Ruff
      files: |
        if git diff --cached --quiet -- .ruff.toml; then
          git diff --cached --name-only --diff-filter=ACMR
        else
          git ls-files
        fi
      glob:
        - "*.py"
      group:
        jobs:
          - name: Lint check
            run: uv run --no-sync ruff check --fix {files}
          - name: Format check
            run: uv run --no-sync ruff format {files}
