pre-commit:
  jobs:
    - name: EditorConfig checker
      files: |
        if git diff --cached --quiet -- .editorconfig; then
          git diff --cached --name-only --diff-filter=ACMR
        else
          git ls-files
        fi
      run: >-
        npm exec --no -- editorconfig-checker {files}
    - name: Prettier
      files: |
        if git diff --cached --quiet -- .prettierrc.*; then
          git diff --cached --name-only --diff-filter=ACMR
        else
          git ls-files
        fi
      run: >-
        npm exec --no -- prettier --check --ignore-unknown {files}
    - name: Tombi
      files: |
        if git diff --cached --quiet -- .tombi.toml; then
          git diff --cached --name-only --diff-filter=ACMR
        else
          git ls-files
        fi
      glob:
        - "*.toml"
      group:
        piped: true
        jobs:
          - name: Linter
            run: >-
              npm exec --no -- tombi lint {files}
          - name: Formatter
            run: >-
              npm exec --no -- tombi format --check {files}
    - name: uv
      glob:
        - ".python-version"
        - "pyproject.toml"
        - "uv.lock"
      group:
        piped: true
        jobs:
          - name: Lock file
            run: >-
              uv lock --check
