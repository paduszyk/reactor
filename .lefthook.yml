templates:
  npm-exec: npm exec --no --
  uv-run: uv run --no-sync --

pre-commit:
  jobs:
    - name: EditorConfig checker
      run: >-
        {npm-exec} editorconfig-checker {staged_files}
    - name: Prettier
      run: >-
        {npm-exec} prettier --check --ignore-unknown {staged_files}
    - name: Tombi
      glob:
        - "*.toml"
      group:
        piped: true
        jobs:
          - name: Linter
            run: >-
              {npm-exec} tombi lint {staged_files}
          - name: Formatter
            run: >-
              {npm-exec} tombi format --check {staged_files}
    - name: uv
      glob:
        - ".python-version"
        - "pyproject.toml"
        - "uv.lock"
      group:
        piped: true
        jobs:
          - name: Lock file
            run: >-
              uv lock --check
    - name: Ruff
      glob:
        - "*.py"
      group:
        piped: true
        jobs:
          - name: Linter
            run: >-
              {uv-run} ruff check --force-exclude {staged_files}
          - name: Formatter
            run: >-
              {uv-run} ruff format --check --force-exclude {staged_files}
    - name: Django
      only:
        - ref: main
      env:
        DJANGO_SETTINGS_MODULE: reactor.conf.settings.dev
      group:
        piped: true
        jobs:
          - name: System check
            run: >-
              {uv-run} python -m django check --fail-level=ERROR
          - name: Migration check
            run: |
              {uv-run} python -m django makemigrations --skip-checks --check
          - name: Translations
            group:
              piped: true
              jobs:
                - name: Extraction
                  run: >-
                    {uv-run} python -m django makemessages --all --no-location --no-obsolete
                - name: Catalog diff
                  run: >-
                    git diff --exit-code -- ":(glob)**/*.po"
                    && test -z "$(git ls-files --others --exclude-standard -- ':(glob)**/*.po')"
                - name: Compilation
                  run: >-
                    {uv-run} python -m django compilemessages --ignore=".venv"
